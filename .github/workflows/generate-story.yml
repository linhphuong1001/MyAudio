name: Sinh truyện mới + TTS

on:
  schedule:
    - cron: "0 2 * * *" # 9:00 sáng giờ Việt Nam hàng ngày (UTC+7), GitHub thường chạy trễ vài giờ
  workflow_dispatch:
    inputs:
      genre:
        description: "Thể loại nền: Cổ Đại / Hiện Đại (để trống = tự chọn)"
        required: false
        default: ""
      theme:
        description: "Chủ đề, vd: Xuyên Không, Trinh Thám, Cung Đấu (để trống = tự chọn)"
        required: false
        default: ""

jobs:
  generate-and-tts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Tự chọn thể loại/chủ đề, crawl nguồn cảm hứng và sinh truyện mới
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
          INPUT_GENRE: ${{ github.event.inputs.genre }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
        run: python pipeline.py auto --genre "$INPUT_GENRE" --theme "$INPUT_THEME"

      - name: Vẽ bìa minh họa cho truyện chưa có bìa
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_AUDIO_BUCKET: Audio
        run: python pipeline.py covers

      - name: Chuyển toàn bộ chương đang chờ thành audio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_AUDIO_BUCKET: Audio
          BACKGROUND_MUSIC_URL: ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/Audio/music/background.mp3
        run: python pipeline.py tts --provider edge --limit 20
